apiVersion: v1
kind: Namespace
metadata:
  name: kirp-system
---
apiVersion: v1
kind: Secret
metadata:
  name: kirp-secrets
  namespace: kirp-system
type: Opaque
data:
  # Placeholder keys; in real deployments use External Secrets or per-env manifests.
  # These values should be overridden by your CI/CD pipeline.
  MONGO_URI: ""
  REDIS_URL: ""
  POSTGRES_URI: ""
  QDRANT_URL: ""
  JWT_SECRET: ""
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kirp-api
  namespace: kirp-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app: kirp-api
  template:
    metadata:
      labels:
        app: kirp-api
    spec:
      containers:
        - name: kirp-api
          image: your-docker-user/kirp-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: kirp-secrets
          env:
            - name: ENV
              value: "production"
          readinessProbe:
            httpGet:
              path: /observability/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /observability/health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: kirp-api-service
  namespace: kirp-system
spec:
  selector:
    app: kirp-api
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kirp-api-ingress
  namespace: kirp-system
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
spec:
  tls:
    - hosts:
        - api.kirp.local
      secretName: kirp-api-tls
  rules:
    - host: api.kirp.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kirp-api-service
                port:
                  number: 80
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: kirp-api-hpa
  namespace: kirp-system
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: kirp-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70

