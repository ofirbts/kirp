name: kirp
services:
  cassandra:
    container_name: kirp-cassandra
    environment:
      CASSANDRA_CLUSTER_NAME: KIRPCluster
      CASSANDRA_DC: datacenter1
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
      CASSANDRA_RACK: rack1
    healthcheck:
      test:
        - CMD-SHELL
        - nodetool status | grep -E '^UN' || exit 1
      timeout: 10s
      interval: 30s
      retries: 5
      start_period: 1m0s
    image: cassandra:4.1
    networks:
      kirp-net: null
    ports:
      - mode: ingress
        target: 9042
        published: "9042"
        protocol: tcp
    restart: always
    volumes:
      - type: volume
        source: cassandra_data
        target: /var/lib/cassandra
        volume: {}
  elasticsearch:
    container_name: kirp-elasticsearch
    environment:
      ES_JAVA_OPTS: -Xms512m -Xmx512m
      discovery.type: single-node
      xpack.security.enabled: "false"
    healthcheck:
      test:
        - CMD-SHELL
        - curl -f http://localhost:9200/_cluster/health || exit 1
      timeout: 10s
      interval: 30s
      retries: 5
      start_period: 1m0s
    image: docker.elastic.co/elasticsearch/elasticsearch:8.10.2
    networks:
      kirp-net: null
    ports:
      - mode: ingress
        target: 9200
        published: "9200"
        protocol: tcp
  grafana:
    container_name: kirp-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    image: grafana/grafana:latest
    networks:
      kirp-net: null
    ports:
      - mode: ingress
        target: 3000
        published: "3000"
        protocol: tcp
    volumes:
      - type: volume
        source: grafana_data
        target: /var/lib/grafana
        volume: {}
  kafka:
    container_name: kirp-kafka
    depends_on:
      zookeeper:
        condition: service_started
        required: true
    environment:
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9093
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_BROKER_ID: "1"
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
    healthcheck:
      test:
        - CMD-SHELL
        - kafka-broker-api-versions --bootstrap-server localhost:9092 || exit 1
      timeout: 10s
      interval: 30s
      retries: 5
      start_period: 1m0s
    image: confluentinc/cp-kafka:7.5.0
    networks:
      kirp-net: null
    ports:
      - mode: ingress
        target: 9092
        published: "9092"
        protocol: tcp
      - mode: ingress
        target: 9093
        published: "9093"
        protocol: tcp
  kirp-agent-processor:
    build:
      context: /home/ofir/projects/kirp
      dockerfile: Dockerfile.agent
    command:
      - python
      - -m
      - src.workers.kafka_processor
    container_name: kirp-agent-processor
