  kirp-net:
    name: kirp_kirp-net
    driver: bridge
volumes:
  cassandra_data:
    name: kirp_cassandra_data
  grafana_data:
    name: kirp_grafana_data
  mongo_data:
    name: kirp_mongo_data
  opa_data:
    name: kirp_opa_data
  postgres_data:
    name: kirp_postgres_data
  prometheus_data:
    name: kirp_prometheus_data
  qdrant_data:
    name: kirp_qdrant_data
