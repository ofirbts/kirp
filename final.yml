  mongo-express:
    container_name: kirp-mongo-express
    depends_on:
      mongodb:
        condition: service_started
        required: true
    environment:
      ME_CONFIG_MONGODB_ADMINPASSWORD: example
      ME_CONFIG_MONGODB_ADMINUSERNAME: root
      ME_CONFIG_MONGODB_SERVER: mongodb
    image: mongo-express:latest
    networks:
      kirp-net: null
    ports:
      - mode: ingress
        target: 8081
        published: "8081"
        protocol: tcp
    restart: always
  mongodb:
    container_name: kirp-mongodb
    environment:
      MONGO_INITDB_ROOT_PASSWORD: example
      MONGO_INITDB_ROOT_USERNAME: root
    healthcheck:
      test:
        - CMD
        - mongosh
        - --eval
        - db.adminCommand('ping')
      timeout: 5s
      interval: 10s
      retries: 5
    image: mongo:7
    networks:
      kirp-net: null
    ports:
      - mode: ingress
        target: 27017
        published: "27017"
        protocol: tcp
    restart: always
    volumes:
      - type: volume
        source: mongo_data
        target: /data/db
        volume: {}
  opa:
    command:
      - run
      - --server
      - --addr=0.0.0.0:8181
      - --log-level=info
      - --set=decision_logs.console=true
      - /policies
    container_name: kirp-opa
    image: openpolicyagent/opa:latest
    networks:
      kirp-net: null
    ports:
      - mode: ingress
        target: 8181
        published: "8181"
        protocol: tcp
    restart: always
    volumes:
      - type: bind
        source: /home/ofir/projects/kirp/deploy/opa/policies
        target: /policies
        bind:
          create_host_path: true
      - type: volume
        source: opa_data
        target: /data
        volume: {}
  postgres:
    container_name: kirp-postgres
    environment:
      POSTGRES_DB: kirp
      POSTGRES_PASSWORD: kirp_password
      POSTGRES_USER: kirp_user
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U kirp_user
      timeout: 5s
      interval: 10s
      retries: 5
    image: postgres:16-alpine
    networks:
      kirp-net: null
    ports:
      - mode: ingress
        target: 5432
        published: "5432"
        protocol: tcp
    restart: always
    volumes:
      - type: volume
        source: postgres_data
        target: /var/lib/postgresql/data
        volume: {}
  prometheus:
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    container_name: kirp-prometheus
    image: prom/prometheus:latest
    networks:
      kirp-net: null
    ports:
      - mode: ingress
        target: 9090
        published: "9090"
        protocol: tcp
    volumes:
      - type: bind
        source: /home/ofir/projects/kirp/deploy/prometheus.yml
        target: /etc/prometheus/prometheus.yml
        bind:
          create_host_path: true
      - type: volume
        source: prometheus_data
        target: /prometheus
        volume: {}
  qdrant:
    build:
      context: /home/ofir/projects/kirp
      dockerfile: deploy/Dockerfile.qdrant
    container_name: kirp-qdrant
    healthcheck:
      test:
        - CMD-SHELL
        - curl -sf http://localhost:6333/healthz || exit 1
      timeout: 5s
      interval: 10s
      retries: 5
      start_period: 20s
    image: kirp-qdrant:local
    networks:
      kirp-net: null
    ports:
      - mode: ingress
        target: 6333
        published: "6333"
        protocol: tcp
      - mode: ingress
        target: 6334
        published: "6334"
        protocol: tcp
    restart: always
    volumes:
      - type: volume
        source: qdrant_data
        target: /qdrant/storage
        volume: {}
  redis:
    command:
      - redis-server
      - --maxmemory
      - 512mb
      - --maxmemory-policy
      - allkeys-lru
    container_name: kirp-redis
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      timeout: 5s
      interval: 10s
      retries: 5
    image: redis:7-alpine
    networks:
      kirp-net: null
    ports:
      - mode: ingress
        target: 6379
        published: "6379"
        protocol: tcp
    restart: always
  zookeeper:
    container_name: kirp-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: "2181"
      ZOOKEEPER_TICK_TIME: "2000"
    image: confluentinc/cp-zookeeper:7.5.0
    networks:
      kirp-net: null
    ports:
      - mode: ingress
        target: 2181
        published: "2181"
        protocol: tcp
