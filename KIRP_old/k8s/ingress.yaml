apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kirp-ingress
  namespace: kirp-system
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  rules:
  - host: api.kirp.ai # תחליף לדומיין שלך
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: kirp-api-service
            port:
              number: 80