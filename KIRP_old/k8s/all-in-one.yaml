apiVersion: v1
kind: Namespace
metadata:
  name: kirp-system
---
apiVersion: v1
kind: Secret
metadata:
  name: kirp-secrets
  namespace: kirp-system
type: Opaque
data:
  # כאן שמים את המפתחות ב-base64 (או משתמשים ב-External Secrets)
  MONGO_URI: bW9uZ29kYjovL3Jvb3Q6ZXhhbXBsZUBtb25nb2RiOjI3MDE3L2tpcnA/YXV0aFNvdXJjZT1hZG1pbg==
  REDIS_URL: cmVkaXM6Ly9yZWRpczp6Mzc5

  apiVersion: apps/v1
kind: Deployment
metadata:
  name: kirp-api
  namespace: kirp-system
spec:
  replicas: 2 # יתירות - אם אחד קורס, השני עובד
  selector:
    matchLabels:
      app: kirp-api
  template:
    metadata:
      labels:
        app: kirp-api
    spec:
      containers:
      - name: kirp-api
        image: your-registry/kirp-api:latest
        ports:
        - containerPort: 8000
        envFrom:
        - secretRef:
            name: kirp-secrets
        env:
        - name: OLLAMA_URL
          value: "http://ollama-service.kirp-system.svc.cluster.local:11434"
---
apiVersion: v1
kind: Service
metadata:
  name: kirp-api-service
  namespace: kirp-system
spec:
  selector:
    app: kirp-api
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8000
  type: LoadBalancer # ייתן לך IP חיצוני לחיבור לוואטסאפ

  apiVersion: apps/v1
kind: Deployment
metadata:
  name: kirp-worker
  namespace: kirp-system
spec:
  replicas: 1 # אפשר להגדיל אם יש עומס הודעות
  selector:
    matchLabels:
      app: kirp-worker
  template:
    metadata:
      labels:
        app: kirp-worker
    spec:
      containers:
      - name: kirp-worker
        image: your-registry/kirp-worker:latest
        command: ["python", "-m", "app.core.worker"]
        envFrom:
        - secretRef:
            name: kirp-secrets

            apiVersion: apps/v1
kind: Deployment
metadata:
  name: kirp-worker
  namespace: kirp-system
spec:
  replicas: 1 # אפשר להגדיל אם יש עומס הודעות
  selector:
    matchLabels:
      app: kirp-worker
  template:
    metadata:
      labels:
        app: kirp-worker
    spec:
      containers:
      - name: kirp-worker
        image: your-registry/kirp-worker:latest
        command: ["python", "-m", "app.core.worker"]
        envFrom:
        - secretRef:
            name: kirp-secrets

            apiVersion: apps/v1
kind: Deployment
metadata:
  name: kirp-worker
  namespace: kirp-system
spec:
  replicas: 1 # אפשר להגדיל אם יש עומס הודעות
  selector:
    matchLabels:
      app: kirp-worker
  template:
    metadata:
      labels:
        app: kirp-worker
    spec:
      containers:
      - name: kirp-worker
        image: your-registry/kirp-worker:latest
        command: ["python", "-m", "app.core.worker"]
        envFrom:
        - secretRef:
            name: kirp-secrets

            apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: kirp-system
spec:
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      containers:
      - name: ollama
        image: ollama/ollama:latest
        ports:
        - containerPort: 11434
        volumes:
        - name: ollama-storage
          persistentVolumeClaim:
            claimName: ollama-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: ollama-service
  namespace: kirp-system
spec:
  selector:
    app: ollama
  ports:
  - port: 11434