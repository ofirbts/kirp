networks:
  kirp-prod-net:
    driver: bridge

services:
  kirp-api:
    build:
      context: ..
      dockerfile: Dockerfile.api
    env_file:
      - ../.env.prod
    environment:
      ENV: production
      API_HOST: 0.0.0.0
      API_PORT: 8000
      # main.py fail-fast checks (must be non-empty) + runtime DSNs
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-sk_test_replace_me}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://kirp_user:kirp_password@postgres:5432/kirp}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      POSTGRES_URI: ${POSTGRES_URI:-postgresql+asyncpg://kirp_user:kirp_password@postgres:5432/kirp}
      MONGO_URI: ${MONGO_URI:-mongodb://mongo:27017/kirp}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      EVENT_BUS_PROVIDER: kafka
      QDRANT_URL: http://qdrant:6333
      OPA_URL: http://opa:8181
      PYTHONPATH: /app
    ports:
      - "8080:8000"
    depends_on:
      - postgres
      - redis
      - mongo
      - zookeeper
      - kafka
      - qdrant
      - opa
    networks:
      - kirp-prod-net
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kirp}
      POSTGRES_USER: ${POSTGRES_USER:-kirp_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kirp_password}
    volumes:
      - kirp_postgres_data:/var/lib/postgresql/data
    networks:
      - kirp-prod-net
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - kirp_redis_data:/data
    networks:
      - kirp-prod-net
    restart: unless-stopped

  mongo:
    image: mongo:7
    volumes:
      - kirp_mongo_data:/data/db
    networks:
      - kirp-prod-net
    restart: unless-stopped

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - kirp-prod-net
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - kirp-prod-net
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.12.4
    networks:
      - kirp-prod-net
    restart: unless-stopped

  opa:
    image: openpolicyagent/opa:latest
    command: ["run", "--server", "--addr=0.0.0.0:8181", "--log-level=error", "/policies"]
    volumes:
      - ./opa/policies:/policies:ro
    networks:
      - kirp-prod-net
    restart: unless-stopped

  kirp-agent-processor:
    build:
      context: ..
      dockerfile: Dockerfile.agent
    env_file:
      - ../.env.prod
    environment:
      DISABLE_PROMETHEUS: "1"
      MONGO_URI: ${MONGO_URI:-mongodb://mongo:27017/kirp}
      POSTGRES_URI: ${POSTGRES_URI:-postgresql+asyncpg://kirp_user:kirp_password@postgres:5432/kirp}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      QDRANT_URL: http://qdrant:6333
      OPA_URL: http://opa:8181
      PYTHONPATH: /app
    depends_on:
      - kafka
      - mongo
      - redis
      - postgres
      - qdrant
      - opa
      - kirp-api
    command: ["python", "-m", "src.workers.kafka_processor"]
    networks:
      - kirp-prod-net
    restart: unless-stopped

volumes:
  kirp_mongo_data:
  kirp_postgres_data:
  kirp_redis_data:
